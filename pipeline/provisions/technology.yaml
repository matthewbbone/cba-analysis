clause_type: technology
clause_description: |-
  Clauses that define workplace technologies and establish rights, permissions, obligations, or prohibitions related to their use or introduction
subtype_taxonomy:
  technology_definitions:
    description: |- 
      key definitions related to workplace technology
    subtypes:
      technological_change_definitions:
        description: |- 
          These definitions establish the scope of what constitutes “technological change” for the purposes of management obligations
        subtypes:
      artificial_intelligence_definitions:
        description: |-
          These definitions often distinguish between general AI, machine learning, generative AI, and traditional rule-based systems
        subtypes:
      wearables_and_sensor_technology_definitions:
        description: |-
          These definitions address devices that collect biometric, health, or movement data from workers, particularly in performance-driven or physically intensive jobs
        subtypes:
      information_and_communications_technology_definitions:
        description: |-
          These provisions define the digital systems, software, and communications tools used by workers in their everyday roles
        subtypes:
  foundational_technology_rights:
    description: |-
      recognition of foundational rights when an employer plans to introduce new or modified technologies
    subtypes:
      notification_and_information_rights:
        description: |-
          requirement that employers notify unions and provide timely, detailed information about planned or potential changes
        subtypes:
      bargaining_rights_on_technolgoy_changes:
        description: |-
          explicitly affirm union rights to negotiate over the introduction and effects of new workplace technologies
        subtypes:
      participation_in_technology_decision_making_processes:
        description: |-
          provisions for active worker participation throughout the technology decision-making process
        subtypes:
      union_jurisdiction_and_work_preservation:
        description: |-
          provisions to protect bargaining unit jurisdiction and prevent job displacement
        subtypes:
  employer_commitments_in_technology_implementation:
    description: |-
      a wide range of employer commitments to ensure that technological change does not undermine workers’ job stability, income security, or working conditions
    subtypes:
      employment_and_economic_security_protections:
        description: |-
          Employment and income protections form the cornerstone of bargaining agreements on technology effects—contract provisions that respond directly to the organizational impacts of new tools, systems, and processes
        subtypes:
      training_and_workforce_development_for_technological_change:
        description: |-
          provisions to ensure that workers can adapt to technological change through guaranteed access to training, fair selection processes, adequate program infrastructure, and long-term educational support
        subtypes:
      technology_related_safety_health_and_accommodation:
        description: |-
          provisions that address the physical, psychological, and accessibility-related impacts of workplace technologies
        subtypes:
  governance_of_workplace_technology_applications:
    description: |-
      how unions have negotiated over the use and governance of specific workplace technology applications
    subtypes:
      electronic_monitoring_and_surveillance_technologies:
        description: |-
          sought to define clear limits, notification processes, and accountability measures to govern how these electronic monitoring and surveillance systems are implemented and used
        subtypes:
      human_resources_and_workforce_management_technologies:
        description: |-
          establish contractual safeguards to ensure that these automated systems for personnel functions such as hiring, evaluation, timekeeping, and scheduling operate fairly, remain accountable to workers and their representatives, and do not override negotiated procedures or erode worker rights
        subtypes:
      work_task_technologies_and_applications:
        description: |-
          provisions to safeguard worker roles, preserve professional autonomy, and ensure equitable and accountable integration of technology into daily work
        subtypes:
  participation_in_technology_governance:
    description: |-
      formal mechanisms to participate in the planning, implementation, and oversight of workplace technologies
    subtypes:
      collaboration_purpose_and_scope:
        description: |-
          establish collaborative goals and activities to guide the governance of workplace technologies
        subtypes:
      structural_elements_of_collaboration_and_participation:
        description: |-
          establish structural parameters for how collaboration is organized
        subtypes:
      operational_guidelines_and_processes_for_collaboration:
        description: |-
          define operational procedures to guide how committees and workgroups operate in practice
        subtypes:
      skills_and_capabilities_for_collaboration:
        description: :-
          provisions to build the capacity of union and management participants—through joint training, dispute resolution practices, and evaluation methods.
        subtypes:
N_EXTRACTION_PASSES: 2
LANGEXTRACT_MAX_WORKERS: 10
LANGEXTRACT_BATCH_LENGTH: 10
MAX_CHAR_BUFFER: [2048, 8192]
ENRICH_MAX_CHAR_BUFFER: 5000
