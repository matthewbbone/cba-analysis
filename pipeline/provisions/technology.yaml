clause_type: technology
clause_description: Clauses that address the introduction of new technology in the workplace.
subtype_taxonomy:
  preemptive_rights:
    description:  |- 
      provisions focused on establishing respective rights and roles regarding the decision to adopt and 
      implement new technology
    subtypes:
      labor_management_cooperation:
        description: |-
          stipulate a union’s “pledge to cooperate” along with management’s promise to make efforts to 
          mitigate the negative impact of technological changes on the workforce
      labor_management_committee: 
        description: |-
          Technological change committees often include equal representation from the union and employer, 
          with variations on employee representative selection procedures.
      research_studies_planning:
        description: |-
          Provisions stipulating research and studies on the impact of technology on the workplace
      notification_right:
        description: |-
          the right to advanced notification about any proposed technological changes in the workplace
      negotiation_right:
        description: |-
          asserts the union's right to negotiate with management regarding the effects of the new 
          technology on jobs as well as the strategy  for introducing the new technology before 
          implementation of the technology.
      participation_right:
        description: |-
          asserts the union’s right to engage in the strategic decision-making surrounding the 
          adoption of new technologies
      technology_restriction:
        description: |-
          establish limitations on management’s right to introduce new technology
  implementation:
    description:  |-
      provisions designed to mitigate the introduction of new technology in the workplace
    subtypes:
      job_displacement:
        description: |-
          outline processes to address job loss due to technological changes in the workplace
      job_protection_transfers:
        description: |-
          protect existing employees, especially employees with seniority, from job loss due to new technologies
      wage_benefit_protection:
        description: |-
          These ‘compensation protection’ clauses attempt to maintain wage levels and/or work hours
      job_restructuring_productivity:
        description: |-
          focus on changes in working conditions associated with new technologies, such as changes in workload, 
          tasks, responsibilities, work schedules, or pace of work
      union_jurisdiction:
        description: |-
          set out to protect or expand the bargaining unit during job restructuring associated with new technologies 
          in the workplace
      workforce_training:
        description: |-
          training provisions cover a variety of topics ranging from simple requirements that employers 
          provide training for new technology to comprehensive training programs for new technologies
      technology_transition_plan:
        description: |-
          Technology transition plans, developed either in anticipation of the introduction of new technology 
          or for a specific planned technological innovation, often outline the process for introducing 
          technological change in the workplace including advanced notification, displacement mitigation 
          strategies, and compensation plans
  workforce_management:
    description:  |-
       provisions related to the use of technology in workforce management
    subtypes:
      monitoring_surveillance:
        description: |-
          contract provisions that ensure employee and union rights to know about the use of these technologies 
          in the workplace and that limit employers’ use of monitoring and surveillance technologies
      internet_usage:
        description: |-
          guidelines for union and member use of social media in order to avoid negative consequences for social 
          media activities
      scheduling:
        description: |-
          provisions to protect workers from unpredictable, unstable, and rigid scheduling practices by employers 
          combined with algorithmic computer scheduling systems
      telework:
        description: |-
          provisions outlining parameters for telecommuting
      maintaining_safety:
        description: |-
          Clauses that outline the employers’ responsibility to protect workers and ensure a safe workplace often 
          stipulate requirements for: regulatory compliance, proper maintenance of equipment and technologies to 
          ensure safety, employee notification of health concerns associated with technology, and employee training 
          on new technology to ensure safety for employees
      technology_safety_review:
        description: |-
          require the employer to study the impact of new technologies on employee health and safety
      technology_hazard_protection:
        description: |-
          Worker protection provisions often detail issues related to specific technologies and set guidelines to 
          protect worker safety and health
N_EXTRACTION_PASSES: 2
LANGEXTRACT_MAX_WORKERS: 10
LANGEXTRACT_BATCH_LENGTH: 10
MAX_CHAR_BUFFER: 5000
