[project]
name = "cba-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dash>=2.18.2",
    "langextract[openai]",
    "matplotlib>=3.10.9",
    "openai>=2.0.0",
    "pymupdf>=1.26.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.4.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers @ git+https://github.com/huggingface/transformers.git",
    "vllm>=0.11.0",
    "wordcloud>=1.9.6",
]

[tool.uv.sources]
vllm = { path = ".local-src/vllm-0.23.0-cu126", editable = true }
langextract = { git = "https://github.com/matthewbbone/langextract", branch = "feature/chunk-size-jitter" }

[tool.uv]
no-build-isolation-package = ["vllm"]
