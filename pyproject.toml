[project]
name = "cba-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langextract",
    "matplotlib>=3.11.1",
    "openai",
    "pandas>=3.0.5",
    "pillow",
    "pymupdf",
    "python-dotenv",
    "pyyaml",
    "tqdm",
    "vllm>=0.26.0",
]

[tool.uv.sources]
langextract = { git = "https://github.com/matthewbbone/langextract", branch = "feat/chunk-offset" }

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
